
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.steveendrive.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steveendrive.launcher'
        minSdk 23
        targetSdk 28
        versionCode 3
        versionName '3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
}
