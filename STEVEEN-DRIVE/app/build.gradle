
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.steveendrive.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steveendrive.launcher'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
