
name: Build STEVEEN-DRIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify AndroidManifest XML
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('STEVEEN-DRIVE/app/src/main/AndroidManifest.xml'); print('AndroidManifest.xml: XML válido')"

      - name: Build APK
        run: gradle -p STEVEEN-DRIVE assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STEVEEN-DRIVE-debug-apk
          path: STEVEEN-DRIVE/app/build/outputs/apk/debug/app-debug.apk
